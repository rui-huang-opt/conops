
name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Configure PyO3 linking
        shell: bash
        run: |
          echo "PYO3_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          python - <<'PY' >> "$GITHUB_ENV"
          import sysconfig
          libdir = sysconfig.get_config_var("LIBDIR")
          if libdir:
              print(f"LIBRARY_PATH={libdir}")
              print(f"LD_LIBRARY_PATH={libdir}")
          PY

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --all-targets

      - name: Test Rust
        run: cargo test

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Test Python integration
        timeout-minutes: 5
        run: python tests/test_semantic_keys.py
