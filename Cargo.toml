[package]
name = "conops-core"
version = "0.5.0"
edition = "2024"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = "1.12.1"
pyo3 = { version = "0.29", features = ["extension-module"] }
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
mdns-sd = "0.21"
numpy = "0.29"
log = "0.4"
pyo3-log = "0.13"
