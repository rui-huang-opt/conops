
[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "conops"
version = "0.5.2"
description = "A Python and Rust package for distributed consensus and optimization."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Rui Huang", email = "ruihuang0421@gmail.com" }]
dependencies = [
    "numpy>=2.2.6",
    "pyzmq>=27.0.0",
    "msgspec>=0.21.1",
    "zeromq-pyre @ https://github.com/zeromq/pyre/archive/master.zip",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.10.3"]
test = ["pytest>=8.0"]

[tool.maturin]
python-source = "python"
module-name = "conops._core"
bindings = "pyo3"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
