
[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "conops"
version = "0.4.5"
description = "A Python package for distributed consensus operations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Rui Huang", email = "ruihuang0421@gmail.com" }]
dependencies = [
    "numpy>=2.2.6",
    "pyzmq>=27.0.0",
    "msgspec>=0.21.1",
    "zeromq-pyre @ https://github.com/zeromq/pyre/archive/master.zip",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.10.3", "networkx>=3.4.2", "ray[default]==2.54.1"]

[tool.maturin]
python-source = "python"
module-name = "conops._core"
bindings = "pyo3"
